name: Profile Cards

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render Profile Cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: twelnina
          cards: overview, contributions, repositories
          output-dir: assets/profile-cards
          themes: dark
          commit: true
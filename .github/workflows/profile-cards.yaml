name: Profile Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,9,15,21 * * *"
      timezone: "Asia/Tokyo"
      
permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate overview card
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: twelnina
          cards: overview
          output-dir: assets/profile-cards
          themes: light,dark
          commit: false

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=twelnina&layout=compact&langs_count=8&theme=transparent&card_width=400&hide_border=true&title_color=7FC3D9&text_color=889098
          path: assets/profile-cards/top-langs-dark.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=twelnina&layout=compact&langs_count=8&theme=transparent&card_width=400&hide_border=true&title_color=8082C3&text_color=5A646F
          path: assets/profile-cards/top-langs-light.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate wakatime card (dark)
        uses: twelnina/wakatime-stats-action@v0.1.0
        with:
          wakatime-api-key: ${{ secrets.WAKATIME_API_KEY }}
          output-path: assets/profile-cards/wakatime-dark.svg
          layout: compact
          langs-count: 8
          card-width: 400
          theme: transparent
          title-color: 7FC3D9
          text-color: 889098
          hide-border: true

      - name: Generate wakatime card (light)
        uses: twelnina/wakatime-stats-action@v0.1.0
        with:
          wakatime-api-key: ${{ secrets.WAKATIME_API_KEY }}
          output-path: assets/profile-cards/wakatime-light.svg
          layout: compact
          langs-count: 8
          card-width: 400
          theme: transparent
          title-color: 8082C3
          text-color: 5A646F
          hide-border: true

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-cards

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(assets): update profile cards"
          git push

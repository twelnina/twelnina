name: Profile Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
      timezone: "Asia/Tokyo"
      
permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: twelnina
          cards: overview
          output-dir: assets/profile-cards
          themes: dark
          commit: false

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=twelnina&layout=compact&langs_count=8&theme=transparent&card_width=400&hide_border=true
          path: assets/profile-cards/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Generate wakatime card
        uses: twelnina/wakatime-stats-action@main
        with:
          wakatime-api-key: ${{ secrets.WAKATIME_API_KEY }}
          output-path: assets/profile-cards/wakatime.svg
          layout: compact
          langs-count: 8
          card-width: 400
          theme: transparent
          hide-border: true

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-cards

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(assets): update profile cards"
          git push
